<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>CashFlix Admin</title>
<style>
:root {
  --bg:#f4f5f7; --surface:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e5e8ee; --soft:#f0f2f6;
  --brand:#0b7a5c; --brand-ink:#ffffff; --brand-soft:#e5f3ee;
  --ok:#0b7a5c; --ok-bg:#e5f3ee; --err:#c2352b; --err-bg:#fdecea; --warn:#a15c07; --warn-bg:#fef3dc;
  --shadow:0 1px 2px rgba(15,23,42,.05), 0 1px 3px rgba(15,23,42,.04);
  --ring:0 0 0 3px rgba(11,122,92,.18);
  --nav-h:0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#0b0f14; --surface:#131a22; --ink:#e7edf3; --muted:#8a97a6; --line:#222c37; --soft:#1a232d;
    --brand:#3ecf9b; --brand-ink:#06251b; --brand-soft:#12342a;
    --ok:#3ecf9b; --ok-bg:#12342a; --err:#f0877c; --err-bg:#3a1f1c; --warn:#e6b45e; --warn-bg:#352a12;
    --shadow:none; --ring:0 0 0 3px rgba(62,207,155,.25);
  }
}
:root[data-theme="dark"] {
  --bg:#0b0f14; --surface:#131a22; --ink:#e7edf3; --muted:#8a97a6; --line:#222c37; --soft:#1a232d;
  --brand:#3ecf9b; --brand-ink:#06251b; --brand-soft:#12342a;
  --ok:#3ecf9b; --ok-bg:#12342a; --err:#f0877c; --err-bg:#3a1f1c; --warn:#e6b45e; --warn-bg:#352a12;
  --shadow:none; --ring:0 0 0 3px rgba(62,207,155,.25);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--ink); font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:none; box-shadow:var(--ring); }
.hidden { display:none !important; }
.num { font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
svg { flex:none; }

/* ---------- shell ---------- */
.shell { min-height:100vh; }
.sidebar { display:none; }
.mobile-top { position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; }
.logo-mark { width:30px; height:30px; border-radius:9px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.logo small { display:block; font-weight:500; color:var(--muted); font-size:11.5px; line-height:1.1; }
.main { padding:18px 16px 40px; max-width:1100px; margin:0 auto; }
.tab { position:relative; border:0; background:none; color:var(--muted); display:flex; align-items:center; justify-content:flex-start; gap:12px; font-size:14.5px; font-weight:600; padding:11px 12px; border-radius:10px; width:100%; text-align:left; }
.tab:hover { background:var(--soft); color:var(--ink); }
.tab.on { background:var(--brand-soft); color:var(--brand); }
.tab .dot { margin-left:auto; min-width:19px; padding:0 5px; border-radius:99px; background:var(--err); color:#fff; font-size:11px; line-height:19px; text-align:center; font-weight:700; }
.nav-items { display:flex; flex-direction:column; gap:2px; }
.menu-btn { width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; color:var(--ink); flex:none; }
.mt-left { display:flex; align-items:center; gap:12px; min-width:0; }
.mt-title { font-weight:700; font-size:16px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drawer-scrim { position:fixed; inset:0; background:rgba(8,12,18,.5); z-index:70; opacity:0; pointer-events:none; transition:opacity .22s; backdrop-filter:blur(2px); }
.drawer { position:fixed; top:0; bottom:0; left:0; width:min(290px,84vw); z-index:71; background:var(--surface); border-right:1px solid var(--line); padding:18px 14px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:20px; transform:translateX(-102%); transition:transform .26s cubic-bezier(.2,.8,.2,1); box-shadow:0 0 40px rgba(0,0,0,.25); overflow-y:auto; }
.drawer .dr-head { display:flex; align-items:center; justify-content:space-between; padding:0 6px; }
body.drawer-open .drawer { transform:none; }
body.drawer-open .drawer-scrim { opacity:1; pointer-events:auto; }
body.drawer-open { overflow:hidden; }
.drawer .side-foot { margin-top:auto; }
@media (prefers-reduced-motion: reduce) { .drawer, .drawer-scrim { transition:none; } }

@media (min-width:900px) {
  .shell { display:grid; grid-template-columns:240px 1fr; }
  .mobile-top, .bottom-nav { display:none; }
  .sidebar { display:flex; flex-direction:column; position:sticky; top:0; height:100vh; background:var(--surface); border-right:1px solid var(--line); padding:20px 14px; gap:22px; }
  .sidebar .logo { padding:0 8px; }
  .menu-btn, .drawer, .drawer-scrim { display:none; }
  .side-foot { margin-top:auto; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:12.5px; color:var(--muted); }
  .side-foot b { display:block; color:var(--ink); font-size:13px; margin-bottom:2px; }
  .main { padding:34px 36px 60px; }
}

/* ---------- page head ---------- */
.page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.page-head h1 { font-size:22px; letter-spacing:-.02em; line-height:1.2; }
.page-head p { color:var(--muted); margin-top:3px; }
.ph-right { display:flex; gap:8px; align-items:center; }
@media (min-width:900px) { .page-head h1 { font-size:26px; } }

/* ---------- controls ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid transparent; background:var(--brand); color:var(--brand-ink); padding:9px 15px; border-radius:10px; font-weight:600; transition:filter .15s, background .15s; }
.btn:hover { filter:brightness(1.07); }
.btn:disabled { opacity:.55; cursor:not-allowed; }
.btn.ghost { background:var(--surface); color:var(--ink); border-color:var(--line); }
.btn.ghost:hover { background:var(--soft); filter:none; }
.btn.ok { background:var(--brand); color:var(--brand-ink); }
.btn.err { background:var(--err-bg); color:var(--err); border-color:transparent; }
.btn.err:hover { filter:brightness(.97); }
.btn.sm { padding:6px 11px; border-radius:8px; font-size:12.5px; white-space:nowrap; }
.btn.block { width:100%; }
.btn.fit { flex:none; }
.field { margin-bottom:14px; }
.field label { display:block; font-weight:600; font-size:12.5px; margin-bottom:6px; color:var(--ink); }
.field .help, .help { color:var(--muted); font-size:12px; margin-top:5px; }
.inp { width:100%; padding:10px 12px; border:1px solid var(--line); background:var(--surface); border-radius:10px; outline:none; transition:border-color .15s, box-shadow .15s; }
.inp:focus { border-color:var(--brand); box-shadow:var(--ring); }
textarea.inp { min-height:140px; resize:vertical; }
.row { display:flex; gap:10px; align-items:center; }
.row > * { flex:1; min-width:0; }
.row > .fit { flex:none; }
.check { display:flex; gap:9px; align-items:center; font-size:13.5px; font-weight:500; margin:6px 0 12px; }
.check input { width:17px; height:17px; accent-color:var(--brand); }
.link { color:var(--ink); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; font-weight:600; background:none; border:0; padding:0; }
.link:hover { text-decoration-color:var(--brand); }
.searchbar { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 6px 6px 14px; margin-bottom:16px; box-shadow:var(--shadow); color:var(--muted); }
.searchbar .inp { border:0; box-shadow:none; padding:8px 4px; background:transparent; color:var(--ink); }

/* ---------- surfaces ---------- */
h2.sec { font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:.02em; margin:26px 2px 10px; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px; }
@media (min-width:700px) { .grid { grid-template-columns:repeat(3,1fr); } }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:4px; }
.stat .k { color:var(--muted); font-size:12.5px; font-weight:500; }
.stat b { font-size:24px; letter-spacing:-.02em; line-height:1.15; }
.stat em { font-style:normal; color:var(--muted); font-size:12px; }
.stat.warn b { color:var(--warn); }
.panel, .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.card { padding:16px; margin-bottom:12px; }
.panel { padding:4px 16px; }
.card .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.card .amt { font-size:21px; font-weight:700; letter-spacing:-.02em; }
.sub { color:var(--muted); font-size:12.5px; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; word-break:break-all; color:var(--ink); }
.badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap; }
.b-pending, .b-processing { background:var(--warn-bg); color:var(--warn); }
.b-paid, .b-on { background:var(--ok-bg); color:var(--ok); }
.b-cancelled, .b-off, .b-blocked { background:var(--err-bg); color:var(--err); }
.b-code { background:var(--soft); color:var(--muted); }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; }
.chip { border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:6px 14px; font-size:13px; font-weight:600; color:var(--muted); }
.chip:hover { color:var(--ink); }
.chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.empty { text-align:center; color:var(--muted); padding:48px 12px; border:1px dashed var(--line); border-radius:14px; background:var(--surface); }
.kv { display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.kv:last-child { border:0; }
.kv span:first-child { color:var(--muted); }
.kv span:last-child { text-align:right; word-break:break-all; font-weight:500; }
.warnbox { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 14px; font-size:13px; margin-bottom:14px; }
pre.sql { background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:12px; overflow-x:auto; white-space:pre; }

.callout { display:flex; align-items:center; gap:14px; border-radius:14px; padding:14px 16px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
.callout.warn { background:var(--warn-bg); border-color:transparent; }
.callout.ok { background:var(--ok-bg); border-color:transparent; }
.co-ico { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:var(--surface); flex:none; }
.callout.warn .co-ico { color:var(--warn); } .callout.ok .co-ico { color:var(--ok); }
.co-body { flex:1; display:flex; flex-direction:column; }
.co-body b { font-size:14.5px; } .co-body span { color:var(--muted); font-size:13px; }
.check-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.check-row:last-child { border:0; }
.cr-body { flex:1; display:flex; flex-direction:column; min-width:0; }
.cr-body b { font-size:13.5px; font-weight:600; }
.cr-body span { color:var(--muted); font-size:12px; word-break:break-word; }
.sdot { width:9px; height:9px; border-radius:50%; flex:none; }
.sdot.ok { background:var(--ok); } .sdot.bad { background:var(--err); }

/* withdrawals + users + offers */
.avatar { width:38px; height:38px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; font-weight:700; flex:none; }
.user-row { cursor:pointer; transition:border-color .15s; padding:12px 14px; margin-bottom:8px; }
.user-row:hover { border-color:var(--brand); }
.user-row .head { align-items:center; }
.uinfo { flex:1; min-width:0; }
.offer-grid { display:grid; grid-template-columns:1fr; gap:12px; }
@media (min-width:900px) { .offer-grid { grid-template-columns:1fr 1fr; } .offer-grid .card { margin:0; } }

/* ---------- sheet + toast ---------- */
.scrim { position:fixed; inset:0; background:rgba(8,12,18,.55); z-index:60; display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
.sheet { background:var(--bg); width:100%; max-width:600px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:20px 18px 30px; border:1px solid var(--line); }
@media (min-width:700px) { .scrim { align-items:center; } .sheet { border-radius:18px; } }
.sheet h3 { font-size:18px; letter-spacing:-.01em; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
.x { border:0; background:var(--soft); color:var(--ink); width:30px; height:30px; border-radius:50%; font-size:18px; line-height:1; }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(14px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; font-size:13.5px; z-index:99; opacity:0; pointer-events:none; transition:all .22s; max-width:calc(100vw - 32px); text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.bad { background:var(--err); color:#fff; }

/* ---------- skeleton ---------- */
.skel, .skel-head { background:linear-gradient(90deg,var(--soft),var(--line),var(--soft)); background-size:200% 100%; border-radius:14px; animation:sh 1.3s infinite linear; }
.skel { height:92px; } .skel.wide { height:180px; margin-top:16px; }
.skel-head { height:34px; width:200px; margin-bottom:18px; border-radius:8px; }
@keyframes sh { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel, .skel-head { animation:none; } .toast { transition:none; } html { scroll-behavior:auto; } }

/* ---------- access screen ---------- */
.gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.gate-card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:var(--shadow); text-align:center; }
.gate-card .logo-mark { margin:0 auto 14px; width:44px; height:44px; font-size:20px; border-radius:12px; }
.gate-card h1 { font-size:20px; letter-spacing:-.01em; margin-bottom:6px; }
.gate-card p { color:var(--muted); margin-bottom:16px; }
</style>
</head>
<body>

<div id="login" class="gate hidden">
  <div class="gate-card">
    <div class="logo-mark">C</div>
    <h1 id="loginTitle">CashFlix Admin</h1>
    <p id="loginMsg">Opening...</p>
    <button class="btn block hidden" id="loginRetry" type="button">Try again</button>
    <form id="testForm" class="hidden" style="margin-top:14px;text-align:left">
      <div class="field"><label for="tpw">Test password</label><input id="tpw" class="inp" type="password" autocomplete="off"></div>
      <button class="btn ghost block" type="submit">Sign in (test)</button>
    </form>
  </div>
</div>

<div id="app" class="shell hidden">
  <aside class="sidebar">
    <div class="logo"><div class="logo-mark">C</div><div>CashFlix<small>Admin console</small></div></div>
    <nav class="nav-items" aria-label="Main"></nav>
    <div class="side-foot"><b style="display:block">Signed in as admin</b>Telegram verified<br><button class="btn ghost sm" id="refreshBtn2" style="margin-top:10px;width:100%">Refresh data</button></div>
  </aside>
  <div>
    <header class="mobile-top">
      <div class="mt-left"><button class="menu-btn" id="menuBtn" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg></button><span class="mt-title" id="mtTitle">Overview</span></div>
      <button class="btn ghost sm" id="refreshBtn" aria-label="Refresh">Refresh</button>
    </header>
    <main class="main" id="view"></main>
  </div>
  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer" aria-label="Menu">
    <div class="dr-head"><div class="logo"><div class="logo-mark">C</div><div>CashFlix<small>Admin console</small></div></div><button class="x" id="drawerClose" aria-label="Close menu">×</button></div>
    <nav class="nav-items" aria-label="Main"></nav>
    <div class="side-foot"><b style="display:block">Signed in as admin</b>Telegram verified<br><button class="btn ghost sm" id="refreshBtn3" style="margin-top:10px;width:100%">Refresh data</button></div>
  </aside>
</div>

<div id="toast" class="toast" role="status"></div>

<script>

async function api(path, method, body, retried) {
  let res;
  try {
    res = await fetch(API + path, { method: method || 'GET', headers: { 'Content-Type':'application/json', 'x-admin-token': TOKEN }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error('Server tak nahi pahunch paya (Render so raha ho sakta hai, 30-50 sec baad try karo)'); }
  let j = {};
  try { j = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== '/admin/login') {
    if (!retried && INIT_DATA) { logout(); if (await tgLogin()) { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); return api(path, method, body, true); } }
    throw new Error('Session khatam. Mini app dobara kholo.');
  }
  if (!res.ok || j.ok === false) throw new Error(j.error || ('Error ' + res.status));
  return j;
}

    const j = await api('/admin/activity?type=' + actType + '&offer=' + encodeURIComponent(actQ));
    $('#alist').innerHTML = j.rows.length ? j.rows.map(r => actType === 'clicks'
      ? '<div class="card"><div class="head"><b>' + esc(r.offer_name) + '</b><span class="sub">' + when(r.created_at) + '</span></div><div class="mono" style="margin-top:6px">' + esc(r.click_id) + '</div>' + (r.ip ? '<div class="sub">IP ' + esc(r.ip) + '</div>' : '') + '</div>'
      : '<div class="card"><div class="head"><div><b>' + esc(r.offer_name) + '</b> <span class="badge b-code">' + esc(r.event) + '</span></div><b class="num">' + inr(r.amount) + '</b></div><div class="mono" style="margin-top:6px">' + esc(r.click_id) + '</div><div class="sub">Phone ' + esc(r.phone) + (r.track_time ? ' · ' + esc(r.track_time) : '') + '</div></div>').join('') : '<div class="empty">Nothing yet.</div>';
  };
  $('#ago').onclick = () => run().catch(e => toast(e.message, true));
  $('#aq').onkeydown = e => { if (e.key === 'Enter') $('#ago').click(); };
  await run();
}

/* ---------- Settings ---------- */
const SETUP_SQL = `create table if not exists offers (
  key text primary key,
  name text unique not null,
  cid text unique not null,
  link text default '',
  param text default 'p1',
  install_amt numeric default 0,
  trial_amt numeric default 0,
  install_balance boolean default false,
  trial_balance boolean default true,
  install_comment text,
  trial_comment text,
  events jsonb default '[]'::jsonb
);
create table if not exists settings (k text primary key, v text);
alter table offers add column if not exists events jsonb default '[]'::jsonb;
alter table users add column if not exists blocked boolean default false;
alter table offer_status add column if not exists captcha boolean default true;
alter table clicks add column if not exists ip text;
alter table withdrawals add column if not exists order_id text;
alter table withdrawals add column if not exists utr text;`;
async function viewSet(v) {
  const [s, h] = await Promise.all([api('/admin/settings'), api('/admin/health')]);
  const x = s.settings;
  v.innerHTML = pageHead('set') + '<h2 class="sec">Withdrawal rules</h2><div class="card">' +
    '<div class="row"><div class="field"><label>Minimum withdraw (₹)</label><input id="s_min" class="inp" type="number" min="1" value="' + x.min_withdraw + '"></div><div class="field"><label>UPI fee (₹)</label><input id="s_fee" class="inp" type="number" min="0" step="0.01" value="' + x.withdraw_fee + '"></div></div>' +
    '<div class="row"><div class="field"><label>Gap between withdrawals (hours)</label><input id="s_cd" class="inp" type="number" min="0" value="' + x.cooldown_hours + '"></div><div class="field"><label>Auto payout up to (₹)</label><input id="s_max" class="inp" type="number" min="0" value="' + x.auto_payout_max + '"></div></div>' +
    '<label class="check"><input type="checkbox" id="s_auto" ' + (x.auto_payout_enabled ? 'checked' : '') + '> Auto payout through gateway is on</label>' +
    '<button class="btn block" id="s_save">Save settings</button>' + (!s.persisted ? '<div class="sub" style="margin-top:8px">Settings table is missing. Changes work now but reset on restart until you run the setup SQL below.</div>' : '') + '</div>' +
    '<h2 class="sec">Setup checks</h2><div class="card">' + h.checks.map(c => '<div class="kv"><span>' + esc(c.k) + '</span><span><span class="badge b-' + (c.ok ? 'on' : 'off') + '">' + (c.ok ? 'OK' : 'Fix') + '</span></span></div>' + (c.ok ? '' : '<div class="sub" style="margin-bottom:6px">' + esc(c.hint) + '</div>')).join('') + '</div>' +
    '<h2 class="sec">Setup SQL (Supabase → SQL Editor)</h2><div class="card"><pre class="sql" id="sqlbox"></pre><button class="btn ghost block" id="sqlcopy" style="margin-top:10px">Copy SQL</button></div>' +
    '<h2 class="sec">Display</h2><div class="card"><div class="row"><button class="btn ghost" data-act="theme" data-id="auto">Auto</button><button class="btn ghost" data-act="theme" data-id="light">Light</button><button class="btn ghost" data-act="theme" data-id="dark">Dark</button></div></div>';
  $('#sqlbox').textContent = SETUP_SQL;
  $('#sqlcopy').onclick = () => copyText(SETUP_SQL);
  $('#s_save').onclick = async () => {
    try {
      const r = await api('/admin/settings', 'POST', { min_withdraw: $('#s_min').value, withdraw_fee: $('#s_fee').value, cooldown_hours: $('#s_cd').value, auto_payout_max: $('#s_max').value, auto_payout_enabled: $('#s_auto').checked });
      toast(r.message, !r.persisted);
    } catch (e) { toast(e.message, true); }
  };
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast('Copied'); }
  catch (e) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copied'); } catch (er) { toast('Copy nahi hua', true); } ta.remove(); }
}

/* ---------- click delegate ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  try {
    if (act === 'goto') go(id);
    else if (act === 'wd-filter') { wdFilter = id; go('wd'); }
    else if (act === 'wd-ok') { if (confirm('Mark ' + inr(el.dataset.amt) + ' as paid? The user gets an approved message.')) { const r = await api('/admin/withdrawal/approve', 'POST', { request_id: id }); toast(r.message); go('wd'); } }
    else if (act === 'wd-no') { if (confirm('Cancel and refund ' + inr(el.dataset.amt) + ' to the user?')) { const r = await api('/admin/withdrawal/cancel', 'POST', { request_id: id }); toast(r.message); go('wd'); } }
    else if (act === 'wd-gw') { if (confirm('Pay this UPI withdrawal through the gateway now?')) { el.disabled = true; const r = await api('/admin/withdrawal/gateway', 'POST', { request_id: id }); toast(r.message); setTimeout(() => go('wd'), 1200); } }
    else if (act === 'user-open') { await openUser(id); }
    else if (act === 'offer-new') offerForm(null);
    else if (act === 'offer-edit') offerForm(OFFER_CACHE.find(o => o.key === id));
    else if (act === 'offer-copy') { const o = OFFER_CACHE.find(x => x.key === id); copyText(shareLink(o.cid)); }
    else if (act === 'offer-live') { const o = OFFER_CACHE.find(x => x.key === id); const r = await api('/admin/offer/status', 'POST', { name: o.name, is_active: !o.status.is_active }); toast(r.message); go('offers'); }
    else if (act === 'offer-cap') { const o = OFFER_CACHE.find(x => x.key === id); const r = await api('/admin/offer/status', 'POST', { name: o.name, captcha: !o.status.captcha }); toast(r.message); go('offers'); }
    else if (act === 'offer-del') { const o = OFFER_CACHE.find(x => x.key === id); if (confirm('Delete ' + o.name + '? Share link band ho jayega.')) { const r = await api('/admin/offer/delete', 'POST', { key: o.key }); toast(r.message); go('offers'); } }
    else if (act === 'offer-del-legacy') { const n = el.dataset.name; if (confirm('Delete ' + n + '? Iske payouts band ho jayenge.')) { const r = await api('/admin/offer/delete', 'POST', { name: n }); toast(r.message); go('offers'); } }
    else if (act === 'act-type') { actType = id; go('act'); }
    else if (act === 'theme') { if (id === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', id); try { localStorage.setItem('cf_admin_theme', id); } catch (er) {} }
  } catch (er) { toast(er.message, true); el.disabled = false; }
});

try { const t = localStorage.getItem('cf_admin_theme'); if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
buildNav();
function openDrawer() { document.body.classList.add('drawer-open'); }
function closeDrawer() { document.body.classList.remove('drawer-open'); }
$('#menuBtn').addEventListener('click', openDrawer);
$('#drawerScrim').addEventListener('click', closeDrawer);
$('#drawerClose').addEventListener('click', closeDrawer);
$('#refreshBtn3').addEventListener('click', () => { closeDrawer(); go(curTab); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
(function () { // swipe: left edge se kholo, left swipe se band
  let sx = 0, sy = 0, on = false;
  document.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; on = true; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
    if (dy > 60 || window.innerWidth >= 900) return;
    if (!document.body.classList.contains('drawer-open') && sx < 24 && dx > 70) openDrawer();
    else if (document.body.classList.contains('drawer-open') && dx < -60) closeDrawer();
  }, { passive: true });
})();
if (TG) { try { TG.ready(); TG.expand(); } catch (e) {} }
(async () => { if (TOKEN) { try { await api('/admin/stats'); showApp(); return; } catch (e) {} } if (await tgLogin()) showApp(); })();
</script>
