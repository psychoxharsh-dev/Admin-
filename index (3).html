<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>CashFlix Admin</title>
<style>
:root {
  --bg:#f4efe6; --surface:#fffdf8; --ink:#1c1f24; --muted:#7b8089; --line:#ebe3d4; --soft:#f4eee2;
  --brand:#c4531f; --brand-ink:#ffffff; --brand-soft:#fde8dc;
  --ok:#1f9d5c; --ok-bg:#e1f4ea; --err:#c2352b; --err-bg:#fdebe7; --warn:#a15c07; --warn-bg:#fdf0d3;
  --shadow:0 1px 2px rgba(60,40,20,.05), 0 6px 18px -10px rgba(60,40,20,.12);
  --ring:0 0 0 3px rgba(196,83,31,.2);
  --nav-h:0px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#16110d; --surface:#211a14; --ink:#f3ece2; --muted:#a89c8c; --line:#352b21; --soft:#2a2119;
    --brand:#f07a3f; --brand-ink:#1a0e07; --brand-soft:#3a2418;
    --ok:#4cc98a; --ok-bg:#163226; --err:#f0877c; --err-bg:#3a1f1c; --warn:#e6b45e; --warn-bg:#352a12;
    --shadow:none; --ring:0 0 0 3px rgba(240,122,63,.28);
  }
}
:root[data-theme="dark"] {
    --bg:#16110d; --surface:#211a14; --ink:#f3ece2; --muted:#a89c8c; --line:#352b21; --soft:#2a2119;
  --brand:#f07a3f; --brand-ink:#1a0e07; --brand-soft:#3a2418;
  --ok:#4cc98a; --ok-bg:#163226; --err:#f0877c; --err-bg:#3a1f1c; --warn:#e6b45e; --warn-bg:#352a12;
  --shadow:none; --ring:0 0 0 3px rgba(240,122,63,.28);
}
* { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body { background:var(--bg); color:var(--ink); font:14px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; min-height:100vh; }
button, input, select, textarea { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:none; box-shadow:var(--ring); }
.hidden { display:none !important; }
.num { font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
svg { flex:none; }

/* ---------- shell ---------- */
.shell { min-height:100vh; }
.sidebar { display:none; }
.mobile-top { position:sticky; top:0; z-index:30; background:var(--surface); border-bottom:1px solid var(--line); padding:10px 16px; display:flex; align-items:center; justify-content:space-between; }
.logo { display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.01em; }
.logo-mark { width:30px; height:30px; border-radius:9px; background:var(--brand); color:var(--brand-ink); display:grid; place-items:center; font-weight:800; font-size:15px; }
.logo small { display:block; font-weight:500; color:var(--muted); font-size:11.5px; line-height:1.1; }
.main { padding:18px 16px 40px; max-width:1100px; margin:0 auto; }
.tab { position:relative; border:0; background:none; color:var(--muted); display:flex; align-items:center; justify-content:flex-start; gap:12px; font-size:14.5px; font-weight:600; padding:11px 12px; border-radius:10px; width:100%; text-align:left; }
.tab:hover { background:var(--soft); color:var(--ink); }
.tab.on { background:var(--brand-soft); color:var(--brand); }
.tab .dot { margin-left:auto; min-width:19px; padding:0 5px; border-radius:99px; background:var(--err); color:#fff; font-size:11px; line-height:19px; text-align:center; font-weight:700; }
.nav-items { display:flex; flex-direction:column; gap:2px; }
.menu-btn { width:40px; height:40px; border-radius:10px; border:1px solid var(--line); background:var(--surface); display:grid; place-items:center; color:var(--ink); flex:none; }
.mt-left { display:flex; align-items:center; gap:12px; min-width:0; }
.mt-title { font-weight:700; font-size:16px; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.drawer-scrim { position:fixed; inset:0; background:rgba(8,12,18,.5); z-index:70; opacity:0; pointer-events:none; transition:opacity .22s; backdrop-filter:blur(2px); }
.drawer { position:fixed; top:0; bottom:0; left:0; width:min(290px,84vw); z-index:71; background:var(--surface); border-right:1px solid var(--line); padding:18px 14px calc(18px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:20px; transform:translateX(-102%); transition:transform .26s cubic-bezier(.2,.8,.2,1); box-shadow:none; overflow-y:auto; visibility:hidden; }
.drawer .dr-head { display:flex; align-items:center; justify-content:space-between; padding:0 6px; }
body.drawer-open .drawer { transform:none; visibility:visible; box-shadow:0 0 40px rgba(0,0,0,.25); }
body.drawer-open .drawer-scrim { opacity:1; pointer-events:auto; }
body.drawer-open { overflow:hidden; }
.drawer .side-foot { margin-top:auto; }
@media (prefers-reduced-motion: reduce) { .drawer, .drawer-scrim { transition:none; } }

@media (min-width:900px) {
  .shell { display:grid; grid-template-columns:240px 1fr; }
  .mobile-top, .bottom-nav { display:none; }
  .sidebar { display:flex; flex-direction:column; position:sticky; top:0; height:100vh; background:var(--surface); border-right:1px solid var(--line); padding:20px 14px; gap:22px; }
  .sidebar .logo { padding:0 8px; }
  .menu-btn, .drawer, .drawer-scrim { display:none; }
  .side-foot { margin-top:auto; padding:12px; border:1px solid var(--line); border-radius:12px; font-size:12.5px; color:var(--muted); }
  .side-foot b { display:block; color:var(--ink); font-size:13px; margin-bottom:2px; }
  .main { padding:34px 36px 60px; }
}

/* ---------- page head ---------- */
.page-head { display:flex; justify-content:space-between; align-items:flex-end; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
.page-head h1 { font-size:22px; letter-spacing:-.02em; line-height:1.2; }
.page-head p { color:var(--muted); margin-top:3px; }
.ph-right { display:flex; gap:8px; align-items:center; }
@media (min-width:900px) { .page-head h1 { font-size:26px; } }

/* ---------- controls ---------- */
.btn { display:inline-flex; align-items:center; justify-content:center; gap:7px; border:1px solid transparent; background:var(--brand); color:var(--brand-ink); padding:9px 15px; border-radius:10px; font-weight:600; transition:filter .15s, background .15s; }
.btn:hover { filter:brightness(1.07); }
.btn:disabled { opacity:.55; cursor:not-allowed; }
.btn.ghost { background:var(--surface); color:var(--ink); border-color:var(--line); }
.btn.ghost:hover { background:var(--soft); filter:none; }
.btn.ok { background:var(--brand); color:var(--brand-ink); }
.btn.err { background:var(--err-bg); color:var(--err); border-color:transparent; }
.btn.err:hover { filter:brightness(.97); }
.btn.sm { padding:6px 11px; border-radius:8px; font-size:12.5px; white-space:nowrap; }
.btn.block { width:100%; }
.btn.fit { flex:none; }
.field { margin-bottom:14px; }
.field label { display:block; font-weight:600; font-size:12.5px; margin-bottom:6px; color:var(--ink); }
.field .help, .help { color:var(--muted); font-size:12px; margin-top:5px; }
.inp { width:100%; padding:10px 12px; border:1px solid var(--line); background:var(--surface); border-radius:10px; outline:none; transition:border-color .15s, box-shadow .15s; }
.inp:focus { border-color:var(--brand); box-shadow:var(--ring); }
textarea.inp { min-height:140px; resize:vertical; }
.row { display:flex; gap:10px; align-items:center; }
.row > * { flex:1; min-width:0; }
.row > .fit { flex:none; }
.check { display:flex; gap:9px; align-items:center; font-size:13.5px; font-weight:500; margin:6px 0 12px; }
.check input { width:17px; height:17px; accent-color:var(--brand); }
.link { color:var(--ink); text-decoration:underline; text-decoration-color:var(--line); text-underline-offset:3px; font-weight:600; background:none; border:0; padding:0; }
.link:hover { text-decoration-color:var(--brand); }
.searchbar { display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 6px 6px 14px; margin-bottom:16px; box-shadow:var(--shadow); color:var(--muted); }
.searchbar .inp { border:0; box-shadow:none; padding:8px 4px; background:transparent; color:var(--ink); }

/* ---------- surfaces ---------- */
h2.sec { font-size:12.5px; font-weight:700; color:var(--muted); letter-spacing:.02em; margin:26px 2px 10px; }
.grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:16px; }
@media (min-width:700px) { .grid { grid-template-columns:repeat(3,1fr); } }
.stat { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:16px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:4px; }
.stat .k { color:var(--muted); font-size:12.5px; font-weight:500; }
.stat b { font-size:24px; letter-spacing:-.02em; line-height:1.15; }
.stat em { font-style:normal; color:var(--muted); font-size:12px; }
.stat.warn b { color:var(--warn); }
.panel, .card { background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.card { padding:16px; margin-bottom:12px; }
.panel { padding:4px 16px; }
.card .head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.card .amt { font-size:21px; font-weight:700; letter-spacing:-.02em; }
.sub { color:var(--muted); font-size:12.5px; }
.mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px; word-break:break-all; color:var(--ink); }
.badge { display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:99px; font-size:11.5px; font-weight:600; white-space:nowrap; }
.b-pending, .b-processing { background:var(--warn-bg); color:var(--warn); }
.b-paid, .b-on { background:var(--ok-bg); color:var(--ok); }
.b-cancelled, .b-off, .b-blocked { background:var(--err-bg); color:var(--err); }
.b-code { background:var(--soft); color:var(--muted); }
.actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
.chips { display:flex; gap:6px; flex-wrap:wrap; margin:0 0 16px; }
.chip { border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:6px 14px; font-size:13px; font-weight:600; color:var(--muted); }
.chip:hover { color:var(--ink); }
.chip.on { background:var(--ink); color:var(--bg); border-color:var(--ink); }
.empty { text-align:center; color:var(--muted); padding:48px 12px; border:1px dashed var(--line); border-radius:14px; background:var(--surface); }
.kv { display:flex; justify-content:space-between; gap:14px; padding:9px 0; border-bottom:1px solid var(--line); font-size:13.5px; }
.kv:last-child { border:0; }
.kv span:first-child { color:var(--muted); }
.kv span:last-child { text-align:right; word-break:break-all; font-weight:500; }
.warnbox { background:var(--warn-bg); color:var(--warn); border-radius:12px; padding:12px 14px; font-size:13px; margin-bottom:14px; }
.modesw { display:flex; gap:4px; background:var(--soft,#f2ead6); border-radius:14px; padding:4px; margin:4px 8px 10px; }
.modesw button { flex:1; border:0; background:none; border-radius:11px; padding:9px 6px; font-weight:700; font-size:13.5px; color:var(--muted); display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
.modesw button.on { background:var(--brand,#e2761b); color:#fff; box-shadow:0 6px 14px -8px rgba(0,0,0,.45); }
.hint-ok { background:var(--ok-bg,#dff3e7); color:var(--ok,#23895a); border-radius:12px; padding:9px 12px; font-size:12.5px; font-weight:700; margin:8px 0; }
pre.sql { background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:12px; font-size:12px; overflow-x:auto; white-space:pre; }

.callout { display:flex; align-items:center; gap:14px; border-radius:14px; padding:14px 16px; border:1px solid var(--line); background:var(--surface); box-shadow:var(--shadow); }
.callout.warn { background:var(--warn-bg); border-color:transparent; }
.callout.ok { background:var(--ok-bg); border-color:transparent; }
.co-ico { width:38px; height:38px; border-radius:10px; display:grid; place-items:center; background:var(--surface); flex:none; }
.callout.warn .co-ico { color:var(--warn); } .callout.ok .co-ico { color:var(--ok); }
.co-body { flex:1; display:flex; flex-direction:column; }
.co-body b { font-size:14.5px; } .co-body span { color:var(--muted); font-size:13px; }
.check-row { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
.check-row:last-child { border:0; }
.cr-body { flex:1; display:flex; flex-direction:column; min-width:0; }
.cr-body b { font-size:13.5px; font-weight:600; }
.cr-body span { color:var(--muted); font-size:12px; word-break:break-word; }
.sdot { width:9px; height:9px; border-radius:50%; flex:none; }
.sdot.ok { background:var(--ok); } .sdot.bad { background:var(--err); }

/* withdrawals + users + offers */
.avatar { width:38px; height:38px; border-radius:50%; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; font-weight:700; flex:none; }
.user-row { cursor:pointer; transition:border-color .15s; padding:12px 14px; margin-bottom:8px; }
.user-row:hover { border-color:var(--brand); }
.user-row .head { align-items:center; }
.uinfo { flex:1; min-width:0; }
.offer-grid { display:grid; grid-template-columns:1fr; gap:12px; }
@media (min-width:900px) { .offer-grid { grid-template-columns:1fr 1fr; } .offer-grid .card { margin:0; } }

/* ---------- sheet + toast ---------- */
.scrim { position:fixed; inset:0; background:rgba(8,12,18,.55); z-index:60; display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
.sheet { background:var(--bg); width:100%; max-width:600px; max-height:92vh; overflow-y:auto; border-radius:20px 20px 0 0; padding:20px 18px 30px; border:1px solid var(--line); }
@media (min-width:700px) { .scrim { align-items:center; } .sheet { border-radius:18px; } }
.sheet h3 { font-size:18px; letter-spacing:-.01em; margin-bottom:14px; display:flex; justify-content:space-between; align-items:center; }
.x { border:0; background:var(--soft); color:var(--ink); width:30px; height:30px; border-radius:50%; font-size:18px; line-height:1; }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(14px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-weight:600; font-size:13.5px; z-index:99; opacity:0; pointer-events:none; transition:all .22s; max-width:calc(100vw - 32px); text-align:center; box-shadow:0 8px 24px rgba(0,0,0,.25); }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.bad { background:var(--err); color:#fff; }

/* ---------- skeleton ---------- */
.skel, .skel-head { background:linear-gradient(90deg,var(--soft),var(--line),var(--soft)); background-size:200% 100%; border-radius:14px; animation:sh 1.3s infinite linear; }
.skel { height:92px; } .skel.wide { height:180px; margin-top:16px; }
.skel-head { height:34px; width:200px; margin-bottom:18px; border-radius:8px; }
@keyframes sh { 0% { background-position:200% 0; } 100% { background-position:-200% 0; } }
@media (prefers-reduced-motion: reduce) { .skel, .skel-head { animation:none; } .toast { transition:none; } html { scroll-behavior:auto; } }

/* ---------- access screen ---------- */
.gate { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
.gate-card { width:100%; max-width:380px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:28px; box-shadow:var(--shadow); text-align:center; }
.gate-card .logo-mark { margin:0 auto 14px; width:44px; height:44px; font-size:20px; border-radius:12px; }
.gate-card h1 { font-size:20px; letter-spacing:-.01em; margin-bottom:6px; }
.gate-card p { color:var(--muted); margin-bottom:16px; }
/* ---- v3 additions ---- */
:root { --c1:#2fae6e; --c2:#f08a4b; --c3:#2563eb; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c1:#4cc98a; --c2:#f59a62; --c3:#7aa2ff; } }
:root[data-theme="dark"] { --c1:#4cc98a; --c2:#f59a62; --c3:#7aa2ff; }
.nav-group { font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:14px 12px 6px; }
.nav-group:first-child { padding-top:2px; }
.switch { position:relative; display:inline-block; width:46px; height:27px; flex:none; }
.switch input { position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:2; }
.switch .track { position:absolute; inset:0; border-radius:99px; background:var(--line); transition:background .2s; }
.switch .track::after { content:''; position:absolute; top:3px; left:3px; width:21px; height:21px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:transform .2s cubic-bezier(.3,.8,.3,1); }
.switch input:checked + .track { background:var(--brand); }
.switch input:checked + .track::after { transform:translateX(19px); }
.switch input:focus-visible + .track { box-shadow:var(--ring); }
.switch input:disabled { cursor:wait; }
.switch.sm { width:38px; height:22px; }
.switch.sm .track::after { width:16px; height:16px; }
.switch.sm input:checked + .track::after { transform:translateX(16px); }
.srow { display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line); }
.srow:last-child { border:0; padding-bottom:2px; }
.srow:first-child { padding-top:2px; }
.srow .st { flex:1; min-width:0; }
.srow .st b { display:block; font-size:14.5px; }
.srow .st span { display:block; color:var(--muted); font-size:12.5px; margin-top:2px; }
.mini-sw { display:flex; gap:16px; margin-top:12px; padding-top:12px; border-top:1px solid var(--line); flex-wrap:wrap; }
.mini-sw label.ms { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:600; color:var(--muted); }
.chartbox { padding:14px 14px 10px; }
.chartbox h3 { font-size:13.5px; margin:0 0 2px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin:6px 0 8px; }
.legend i { display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.chart svg { width:100%; height:auto; display:block; overflow:visible; }
.chart text { fill:var(--muted); font-size:10px; }
.chart .gl { stroke:var(--line); stroke-width:1; }
.bar-track { height:7px; border-radius:99px; background:var(--soft); overflow:hidden; margin-top:6px; }
.bar-fill { height:100%; border-radius:99px; background:var(--brand); }
.sev { text-transform:uppercase; letter-spacing:.04em; font-size:10.5px; }
.sev-high { background:var(--err-bg); color:var(--err); }
.sev-med { background:var(--warn-bg); color:var(--warn); }
.ulist { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; }
.ubtn { border:1px solid var(--line); background:var(--surface); border-radius:99px; padding:4px 11px; font-size:12.5px; font-weight:600; color:var(--ink); }
.ubtn:hover { background:var(--soft); }
.ubtn.bl { color:var(--err); }
.tgprev { background:#e9eef5; border-radius:14px; padding:14px; }
:root[data-theme="dark"] .tgprev { background:#0e1621; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tgprev { background:#0e1621; } }
.tgbub { background:#fff; color:#111; border-radius:14px 14px 14px 4px; padding:9px 12px; max-width:92%; font-size:14px; white-space:pre-wrap; word-break:break-word; box-shadow:0 1px 2px rgba(0,0,0,.12); }
:root[data-theme="dark"] .tgbub { background:#182533; color:#f1f5f9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tgbub { background:#182533; color:#f1f5f9; } }
.tgbtn { margin-top:6px; max-width:92%; text-align:center; background:rgba(60,130,200,.18); color:#2a6cb0; border-radius:10px; padding:8px; font-size:13.5px; font-weight:600; }
.progress { height:10px; border-radius:99px; background:var(--soft); overflow:hidden; margin:10px 0 6px; }
.progress > div { height:100%; background:var(--brand); transition:width .4s; }
.logrow { display:flex; gap:12px; padding:11px 0; border-bottom:1px solid var(--line); align-items:flex-start; }
.logrow:last-child { border:0; }
.logdot { width:30px; height:30px; border-radius:9px; background:var(--brand-soft); color:var(--brand); display:grid; place-items:center; flex:none; }
.logrow b { font-size:13.5px; text-transform:capitalize; }
.tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:4px; }
.tags span { background:var(--soft); border-radius:6px; padding:2px 7px; font-size:11.5px; color:var(--muted); }
.tools-grid { display:grid; grid-template-columns:1fr; gap:12px; }
@media (min-width:700px) { .tools-grid { grid-template-columns:1fr 1fr; } }
.pill-stat { display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
.pill-stat .stat { flex:1; min-width:120px; margin-top:0; }
select.inp { appearance:auto; }
.two { display:grid; grid-template-columns:1fr; gap:12px; align-items:start; }
@media (min-width:900px) { .two { grid-template-columns:1fr 1fr; } }
.sysb .warnbox { margin-bottom:12px; }

let toastTimer;
function toast(msg, bad) {
  const t = $('#toast');
  t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.className = 'toast'; }, 3200);
}

async function api(path, method, body, retried) {
  let res;
  try {
    res = await fetch(API + path, { method: method || 'GET', headers: { 'Content-Type':'application/json', 'x-admin-token': TOKEN }, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { throw new Error('Server tak nahi pahunch paya (Render so raha ho sakta hai, 30-50 sec baad try karo)'); }
  let j = {};
  try { j = await res.json(); } catch (e) {}
  if (res.status === 401 && path !== '/admin/login') {
    if (!retried && INIT_DATA) { logout(); if (await tgLogin()) { $('#login').classList.add('hidden'); $('#app').classList.remove('hidden'); return api(path, method, body, true); } }
    throw new Error('Session khatam. Mini app dobara kholo.');
  }
  if (!res.ok || j.ok === false) throw new Error(j.error || ('Error ' + res.status));
  return j;
}

async function tgLogin() {

    try { const j = await api('/admin/login', 'POST', { open: true }); TOKEN = j.token; try { sessionStorage.setItem('cf_admin_token', TOKEN); } catch (e) {} return true; } catch (e) {}
    showLogin('Open from Telegram', 'This panel only opens inside your admin bot in Telegram.', false); $('#testForm').classList.remove('hidden'); return false; }
  showLogin('CashFlix Admin', 'Signing in...', false);

    TOKEN = j.token; try { sessionStorage.setItem('cf_admin_token', TOKEN); } catch (e) {}

function pickImage(file, max, q) {
  return new Promise((ok, bad) => {
    const fr = new FileReader();
    fr.onerror = () => bad(new Error('File padh nahi paya'));
    fr.onload = () => { const im = new Image(); im.onerror = () => bad(new Error('Image nahi hai')); im.onload = () => {
      const r = Math.min(1, (max || 1000) / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * r); c.height = Math.round(im.height * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      let out = c.toDataURL('image/jpeg', q || 0.72);
      if (out.length > 900000) out = c.toDataURL('image/jpeg', 0.5);
      out.length > 950000 ? bad(new Error('Image bahut badi hai')) : ok(out);
    }; im.src = fr.result; };
    fr.readAsDataURL(file);
  });
}

let hmRange = '7', hmFrom = '', hmTo = '';
const istStr = ms => new Date(ms + 19800000).toISOString().slice(0, 10);
function hmDates() {
  const now = Date.now(), t = istStr(now), D = 86400000;
  if (hmRange === 'today') return [t, t];
  if (hmRange === 'yesterday') { const y = istStr(now - D); return [y, y]; }
  if (hmRange === '30') return [istStr(now - 29 * D), t];
  if (hmRange === 'month') return [t.slice(0, 8) + '01', t];
  if (hmRange === 'custom' && hmFrom && hmTo && hmTo >= hmFrom) return [hmFrom, hmTo];
  return [istStr(now - 6 * D), t];
}
function lineChart(data, left, right) {
  const W = 340, H = 200, pl = 30, pr = 40, pt = 10, pb = 26, pw = W - pl - pr, ph = H - pt - pb, n = data.length;
  const nice = r => { const mag = Math.pow(10, Math.floor(Math.log10(Math.max(r, 1)))); return Math.max(1, Math.ceil(r / mag * 2) / 2 * mag); };
  const lm = nice(Math.max.apply(null, [1].concat(data.map(r => Math.max.apply(null, left.map(s => r[s.k])))))), rm = nice(Math.max.apply(null, [1].concat(data.map(r => Math.max.apply(null, right.map(s => r[s.k]))))));
  const X = i => pl + (n === 1 ? pw / 2 : i * pw / (n - 1)), Y = (v, m) => pt + ph * (1 - v / m);
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = pt + ph * (1 - i / 4); g += '<line class="gl" x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (pl - 6) + '" y="' + (y + 3) + '" text-anchor="end">' + cnum(lm * i / 4) + '</text><text x="' + (W - pr + 6) + '" y="' + (y + 3) + '">₹' + cnum(rm * i / 4) + '</text>'; }
  const draw = (s, m) => {
    const pts = data.map((r, i) => X(i).toFixed(1) + ',' + Y(r[s.k], m).toFixed(1));
    let o = n > 1 ? '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(' + s.c + ')" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>' : '';
    if (n <= 31) data.forEach((r, i) => { o += '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(r[s.k], m).toFixed(1) + '" r="3.2" fill="var(--surface)" stroke="var(' + s.c + ')" stroke-width="2"><title>' + r.d + ' · ' + s.l + ': ' + r[s.k] + '</title></circle>'; });
    return o;
  };
  left.forEach(s => { g += draw(s, lm); }); right.forEach(s => { g += draw(s, rm); });
  const step = Math.ceil(n / 6);
  data.forEach((r, i) => { if (i % step === 0 || i === n - 1) { const dt = new Date(r.d + 'T00:00:00Z'); g += '<text x="' + X(i) + '" y="' + (H - 7) + '" text-anchor="middle">' + (n <= 8 ? dt.toLocaleDateString('en-US', { weekday: 'short', timeZone: 'UTC' }) + ' ' + r.d.slice(8) : r.d.slice(8) + '/' + r.d.slice(5, 7)) + '</text>'; } });
  return '<div class="chart"><svg viewBox="0 0 ' + W + ' ' + H + '" role="img">' + g + '</svg></div>';
}

async function lvPoll() {

function barChart(data, series) {

  const raw = Math.max.apply(null, [1].concat(data.map(r => Math.max.apply(null, series.map(s => r[s.k])))));

    series.forEach((s, j) => {

async function pollBc() {
  clearTimeout(bcTimer);
  if (curTab !== 'bc') return;
  try {
    const b = (await api('/admin/broadcast/status')).broadcast, el = $('#bstat');
    if (!el) return;
    const done = b.sent + b.failed, pct = b.total ? Math.round(done / b.total * 100) : 0;
    if (!b.running && !b.done) return;
    const errs = Object.keys(b.errors || {}).map(k => '<div class="kv"><span>' + esc(k) + '</span><span>' + b.errors[k] + '</span></div>').join('');
    el.innerHTML = '<div class="progress"><div style="width:' + pct + '%"></div></div><div><b>' + b.sent + '</b> sent · <b>' + b.failed + '</b> failed · ' + b.total + ' total' + (b.running ? ' · sending...' : (b.stopped ? ' · stopped' : ' · done')) + '</div>' +
      (b.running ? '<div class="actions"><button class="btn sm err" data-act="bc-stop">Stop</button></div>' : '') + (errs ? '<div style="margin-top:10px">' + errs + '</div><div class="help">Failed zyada tar wo users hote hain jinhone bot block kiya ya start nahi kiya.</div>' : '');
    if (b.running) bcTimer = setTimeout(pollBc, 2000);
  } catch (e) {}
}

function payNowSheet() {
  const body = openSheet('Pay UPI',
    '<div class="field"><label>UPI ID</label><input id="pn_u" class="inp" placeholder="name@bank" autocapitalize="none" autocomplete="off" spellcheck="false"></div>' +

    '<div id="pn_res"></div><button class="btn block" id="pn_go">Pay now</button>');
  const res = (ok, big, lines) => '<div style="text-align:center;padding:14px 4px"><div style="font-size:44px;line-height:1">' + big + '</div><div style="font-weight:700;margin:8px 0 4px;color:' + ok + '">' + lines[0] + '</div>' + lines.slice(1).map(x => '<div class="sub">' + x + '</div>').join('') + '</div>';
  const show = (r, again) => {
    const L = ['Payment of ' + inr(r.amount) + ' to ' + esc(r.upi)];
    if (r.status === 'success') $('#pn_res', body).innerHTML = res('#23895a', '✅', ['Payment successful'].concat(L, r.utr ? ['UTR: <b class="mono">' + esc(r.utr) + '</b>'] : [], ['Ref: ' + esc(r.order_id || '')]));
    else if (r.status === 'failed') $('#pn_res', body).innerHTML = res('#c8372b', '❌', ['Payment failed'].concat(L, [esc(r.message || '')]));
    else $('#pn_res', body).innerHTML = res('#b3730f', '⏳', ['Processing'].concat(L, [esc(r.message || 'Waiting for the bank'), '<button class="btn ghost sm" id="pn_chk" style="margin-top:8px">Check status</button>']));
    const c = $('#pn_chk', body); if (c) c.onclick = async () => { c.disabled = true; try { const k = await api('/admin/upi/payout-status?order_id=' + encodeURIComponent(r.order_id)); show(Object.assign({}, r, k, { message: '' })); } catch (e) { toast(e.message, true); c.disabled = false; } };
  };
  $('#pn_go', body).onclick = async () => {
    const b = $('#pn_go', body), u = $('#pn_u', body).value.trim().toLowerCase(), a = parseFloat($('#pn_a', body).value);
    if (!/^[a-z0-9._-]{2,40}@[a-z][a-z0-9]{1,30}$/.test(u)) return toast('Enter a valid UPI ID', true);
    if (!(a >= 1)) return toast('Minimum amount is ₹1', true);
    if (!confirm('Send ' + inr(a) + ' to ' + u + ' through the gateway now?')) return;
    b.disabled = true; b.textContent = 'Sending…';
    try { const r = await api('/admin/upi/payout-now', 'POST', { upi: u, amount: a, note: $('#pn_n', body).value.trim() }); show(r); b.textContent = 'Pay another'; b.disabled = false; $('#pn_a', body).value = ''; }
    catch (e) { toast(e.message, true); b.textContent = 'Pay now'; b.disabled = false; }
  };
}

/* ---------- switches (instant save) ---------- */
document.addEventListener('change', async e => {
  const t = e.target;
  if (!t.matches || !t.matches('input[data-sw]')) return;
  const kind = t.dataset.sw, on = t.checked;
  const undo = () => { t.checked = !on; };
  try {
    if (kind === 'setting') {
      const key = t.dataset.key;
      if (key === 'maintenance' && on && !confirm('Maintenance ON karne se saare offers band ho jayenge. Pakka?')) return undo();
      if (key === 'withdraw_enabled' && !on && !confirm('Withdrawals band karoge? Users withdraw nahi kar payenge.')) return undo();
      t.disabled = true;
      const body = {}; body[key] = on;
      const r = await api('/admin/settings', 'POST', body); SYS = r.settings; toast(on ? 'Turned on' : 'Turned off', !r.persisted);
      document.querySelectorAll('.sysb').forEach(el => { el.innerHTML = sysHtml(); });
    } else if (kind === 'ip' || kind === 'track' || kind === 'refer') {
      const o = OFFER_CACHE.find(x => x.key === t.dataset.id);
      t.disabled = true;
      const r = await api('/admin/offer/flag', 'POST', { name: o.name, flag: kind, on });
      OFLAGS[o.name] = r.flags; toast(on ? 'Turned on' : 'Turned off');
    } else if (kind === 'live' || kind === 'cap') {
      const o = OFFER_CACHE.find(x => x.key === t.dataset.id);
      t.disabled = true;
      const body = { name: o.name }; body[kind === 'live' ? 'is_active' : 'captcha'] = on;
      const r = await api('/admin/offer/status', 'POST', body);
      o.status[kind === 'live' ? 'is_active' : 'captcha'] = on;
      const bd = t.closest('.card').querySelector('[data-badge="' + kind + '"]');
      if (bd) { bd.className = 'badge b-' + (on ? 'on' : 'off'); bd.textContent = kind === 'live' ? (on ? 'Live' : 'Paused') : 'Captcha ' + (on ? 'on' : 'off'); }
      toast(r.message);
    }
  } catch (er) { undo(); toast(er.message, true); }
  t.disabled = false;
});

    else if (act === 'bc-stop') { const r = await api('/admin/broadcast/stop', 'POST', {}); toast(r.message); }
    else if (act === 'fr-block') { const ids = el.dataset.ids.split(','); if (confirm('Block ' + ids.length + ' account' + (ids.length > 1 ? 's' : '') + '?')) { el.disabled = true; for (const t of ids) await api('/admin/user/block', 'POST', { telegram_id: t, blocked: true }); toast(ids.length + ' blocked'); go('fr'); } }
    else if (act === 'export') { el.disabled = true; try { const r = await api('/admin/export?type=' + id); showFileSheet('Export: ' + id + ' (' + r.rows + ' rows)', r.filename, r.csv); } finally { el.disabled = false; } }
    else if (act === 'theme') { if (id === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', id); try { localStorage.setItem('cf_admin_theme', id); } catch (er) {} }
  } catch (er) { toast(er.message, true); el.disabled = false; }
});

try { const t = localStorage.getItem('cf_admin_theme'); if (t && t !== 'auto') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
buildNav();
function openDrawer() { document.body.classList.add('drawer-open'); }
function closeDrawer() { document.body.classList.remove('drawer-open'); }
$('#menuBtn').addEventListener('click', openDrawer);
$('#drawerScrim').addEventListener('click', closeDrawer);
$('#drawerClose').addEventListener('click', closeDrawer);
$('#refreshBtn3').addEventListener('click', () => { closeDrawer(); go(curTab); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
(function () { // swipe: left edge se kholo, left swipe se band
  let sx = 0, sy = 0, on = false;
  document.addEventListener('touchstart', e => { const t = e.touches[0]; sx = t.clientX; sy = t.clientY; on = true; }, { passive: true });
  document.addEventListener('touchend', e => {
    if (!on) return; on = false;
    const t = e.changedTouches[0], dx = t.clientX - sx, dy = Math.abs(t.clientY - sy);
    if (dy > 60 || window.innerWidth >= 900) return;
    if (!document.body.classList.contains('drawer-open') && sx < 24 && dx > 70) openDrawer();
    else if (document.body.classList.contains('drawer-open') && dx < -60) closeDrawer();
  }, { passive: true });
})();
if (TG) { try { TG.ready(); TG.expand(); } catch (e) {} }
(async () => { if (TOKEN) { try { await api('/admin/stats'); showApp(); return; } catch (e) {} } if (await tgLogin()) showApp(); })();
</script>
